<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Motorcycle body -->
  <path d="M350,250 L300,250 L270,200 L200,200 L150,250 L100,250" stroke="#e74c3c" stroke-width="10" fill="none" />
  <rect x="200" y="180" width="100" height="40" rx="10" fill="#e74c3c" />
  
  <!-- Seat -->
  <rect x="220" y="160" width="60" height="20" rx="10" fill="#34495e" />
  
  <!-- Handlebars -->
  <path d="M150,250 L150,220 L180,200" stroke="#7f8c8d" stroke-width="5" fill="none" />
  <path d="M350,250 L350,220 L320,200" stroke="#7f8c8d" stroke-width="5" fill="none" />
  
  <!-- Wheels -->
  <circle cx="100" cy="250" r="40" fill="#34495e" />
  <circle cx="100" cy="250" r="20" fill="#7f8c8d" />
  <circle cx="350" cy="250" r="40" fill="#34495e" />
  <circle cx="350" cy="250" r="20" fill="#7f8c8d" />
  
  <!-- Headlight -->
  <circle cx="180" cy="200" r="10" fill="#f1c40f" />
</svg>